name: Build AlphaPi OneS Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          PROJECT_DIR=$(dirname "$(find . -maxdepth 3 -name "CMakeLists.txt" -exec grep -l "project(" {} + | head -n 1)")
          echo "Found ESP-IDF project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          if [ -f ones.defaults ]; then
            cp ones.defaults sdkconfig.defaults.esp32s2
          fi
          idf.py set-target esp32s2
          idf.py -DBOARD_NAME=alphapi-one-s-desktop build
          mkdir -p "$GITHUB_WORKSPACE/release_bins"
          cp build/xiaozhi.bin "$GITHUB_WORKSPACE/release_bins/AlphaPi-OneS-Desktop-Dark.bin" || true
          cp build/bootloader/bootloader.bin "$GITHUB_WORKSPACE/release_bins/" || true
          cp build/partition_table/partition-table.bin "$GITHUB_WORKSPACE/release_bins/" || true
          cp build/ota_data_initial.bin "$GITHUB_WORKSPACE/release_bins/" || true
          cp build/assets.bin "$GITHUB_WORKSPACE/release_bins/" || true

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaPi-OneS-ESP32S2-Firmware
          path: release_bins/
